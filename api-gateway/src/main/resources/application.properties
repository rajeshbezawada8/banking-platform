# =========================================
# APPLICATION
# =========================================

spring.application.name=api-gateway
server.port=8080


# =========================================
# EUREKA CLIENT
# =========================================

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# =========================================
# GATEWAY ROUTES
# =========================================

# Authentication Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Customer Service
spring.cloud.gateway.server.webmvc.routes[1].id=customer-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/customers/**


# =========================================
# ACTUATOR
# =========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always